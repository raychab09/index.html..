<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Dark Container for contrast -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#090d16" opacity="0.45" />

  <!-- Central Brain / Light Emblem -->
  <g transform="translate(256, 230) scale(1.15)" filter="url(#glow)">
    <!-- Brain left hemisphere -->
    <path d="M-20,-90 C-70,-90 -110,-55 -110,-10 C-110,15 -95,35 -80,45 C-105,65 -100,105 -65,115 C-45,120 -30,110 -20,95 C-20,40 -20,-30 -20,-90 Z" fill="url(#brainGrad)" opacity="0.95"/>
    
    <!-- Brain right hemisphere -->
    <path d="M20,-90 C70,-90 110,-55 110,-10 C110,15 95,35 80,45 C105,65 100,105 65,115 C45,120 30,110 20,95 C20,40 20,-30 20,-90 Z" fill="url(#brainGrad)" opacity="0.95"/>
    
    <!-- Synaptic Nodes & Dots -->
    <circle cx="-60" cy="-25" r="9" fill="#818cf8" />
    <circle cx="60" cy="-25" r="9" fill="#818cf8" />
    <circle cx="-45" cy="50" r="7.5" fill="#c084fc" />
    <circle cx="45" cy="50" r="7.5" fill="#c084fc" />

    <!-- Connecting Spark Lines -->
    <path d="M-60,-25 Q-40,10 -45,50" stroke="#818cf8" stroke-width="4" fill="none" opacity="0.8" />
    <path d="M60,-25 Q40,10 45,50" stroke="#818cf8" stroke-width="4" fill="none" opacity="0.8" />
  </g>

  <!-- Golden Crown / Sparkle at the top -->
  <g transform="translate(256, 85)">
    <path d="M-40,25 L-25,-15 L0,5 L25,-15 L40,25 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" />
    <circle cx="-25" cy="-20" r="4" fill="#fef08a" />
    <circle cx="0" cy="0" r="4" fill="#fef08a" />
    <circle cx="25" cy="-20" r="4" fill="#fef08a" />
  </g>

  <!-- Arabic Typography "تحدي المعرفة" -->
  <text x="256" y="440" font-family="'Tajawal', 'Segoe UI', Tahoma, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">تحدي المعرفة</text>
</svg>
